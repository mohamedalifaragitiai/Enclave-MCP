<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="936" viewBox="0 0 1600 936">
  <style>
    .canvas      { fill: #ffffff; }
    text         { font-family: "Inter", "Segoe UI", "DejaVu Sans", Helvetica, Arial, sans-serif; }

    .title       { font-size: 27px; font-weight: 700; fill: #0b1220; letter-spacing: -0.4px; }
    .subtitle    { font-size: 14px; fill: #64748b; }
    .metaLabel   { font-size: 10px; font-weight: 700; fill: #94a3b8; letter-spacing: 1.1px; }
    .metaValue   { font-size: 12px; fill: #334155; }

    .band        { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
    .bandInner   { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1.5; }
    .bandNet     { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .bandLabel   { font-size: 10.5px; font-weight: 700; fill: #94a3b8; letter-spacing: 1.3px; }
    .bandNote    { font-size: 11px; fill: #94a3b8; }

    .card        { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
    .cardTitle   { font-size: 17px; font-weight: 700; fill: #0b1220; }
    .cardRole    { font-size: 12.5px; fill: #475569; }
    .cardMeta    { font-size: 11px; fill: #94a3b8; }
    .tag         { font-size: 9.5px; font-weight: 700; letter-spacing: 0.9px; }

    .flow        { stroke: #94a3b8; stroke-width: 1.8; fill: none; }
    .badgeC      { fill: #475569; }
    .badgeT      { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .pill        { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1; }
    .pillT       { font-size: 9.5px; font-weight: 700; fill: #b45309; letter-spacing: 0.6px; }

    .legendH     { font-size: 10.5px; font-weight: 700; fill: #94a3b8; letter-spacing: 1.3px; }
    .legendT     { font-size: 12px; fill: #475569; }
    .rule        { stroke: #e2e8f0; stroke-width: 1; }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect class="canvas" width="1600" height="936"/>

  <!-- ============ TITLE BLOCK ============ -->
  <text class="title" x="48" y="62">Sovereign MCP Platform</text>
  <text class="subtitle" x="48" y="86">As-built runtime architecture &#183; containerised deployment</text>

  <line class="rule" x1="48" y1="106" x2="1552" y2="106"/>
  <text class="metaLabel" x="48"   y="128">STATUS</text>
  <text class="metaValue" x="48"   y="146">Phases 1-6 complete</text>
  <text class="metaLabel" x="300"  y="128">TRANSPORT</text>
  <text class="metaValue" x="300"  y="146">MCP over HTTP, API-key gated</text>
  <text class="metaLabel" x="640"  y="128">INFERENCE</text>
  <text class="metaValue" x="640"  y="146">One shared local LLM, no cloud</text>
  <text class="metaLabel" x="1000" y="128">STORAGE</text>
  <text class="metaValue" x="1000" y="146">All state on M:\, zero writes to C:\</text>
  <text class="metaLabel" x="1360" y="128">SOURCE</text>
  <text class="metaValue" x="1360" y="146">design/architecture.svg</text>

  <!-- ============ BOUNDARIES ============ -->
  <rect class="band"      x="48"  y="180" width="1504" height="572" rx="10"/>
  <text  class="bandLabel" x="70" y="206">WINDOWS HOST</text>
  <text  class="bandNote"  x="196" y="206">M:\MCP_Project</text>

  <rect class="bandInner" x="76"  y="222" width="1046" height="508" rx="9"/>
  <text  class="bandLabel" x="98" y="248">WSL2 DISTRO &#183; DOCKERENGINE</text>
  <text  class="bandNote"  x="330" y="248">ext4.vhdx on M:\ &#183; Docker data-root by construction</text>

  <rect class="bandNet"   x="104" y="290" width="990" height="412" rx="8"/>
  <text  class="bandLabel" x="126" y="316">COMPOSE NETWORK</text>
  <text  class="bandNote"  x="286" y="316">no published ports &#183; unreachable from the host network</text>

  <!-- ============ AGENT ============ -->
  <rect class="card" x="132" y="340" width="262" height="140" rx="8" filter="url(#sh)"/>
  <rect x="132" y="340" width="262" height="3.5" rx="1.75" fill="#2563eb"/>
  <text class="cardTitle" x="154" y="374">agent</text>
  <rect x="252" y="360" width="74" height="17" rx="8.5" fill="#eff6ff"/>
  <text class="tag" x="262" y="372" fill="#2563eb">MCP HOST</text>
  <text class="cardRole" x="154" y="399">LangGraph reasoning loop</text>
  <text class="cardRole" x="154" y="418">Merges both servers' tools</text>
  <text class="cardMeta" x="154" y="443">Explicit StateGraph &#183; 6-round cap</text>
  <text class="cardMeta" x="154" y="462">agent:0.3.0 &#183; 355 MB</text>

  <!-- ============ RAG SERVER ============ -->
  <rect class="card" x="452" y="340" width="290" height="140" rx="8" filter="url(#sh)"/>
  <rect x="452" y="340" width="290" height="3.5" rx="1.75" fill="#0d9488"/>
  <text class="cardTitle" x="474" y="374">rag_server</text>
  <rect x="620" y="360" width="92" height="17" rx="8.5" fill="#f0fdfa"/>
  <text class="tag" x="630" y="372" fill="#0d9488">MCP SERVER</text>
  <text class="cardRole" x="474" y="399">Semantic search over the corpus</text>
  <text class="cardRole" x="474" y="418">Chunk resource &#183; answer prompt</text>
  <text class="cardMeta" x="474" y="443">ChromaDB &#183; bge-small-en-v1.5 (ONNX)</text>
  <text class="cardMeta" x="474" y="462">rag_server:0.2.0 &#183; 933 MB</text>

  <!-- ============ DOCS SERVER ============ -->
  <rect class="card" x="452" y="530" width="290" height="140" rx="8" filter="url(#sh)"/>
  <rect x="452" y="530" width="290" height="3.5" rx="1.75" fill="#7c3aed"/>
  <text class="cardTitle" x="474" y="564">docs_server</text>
  <rect x="620" y="550" width="92" height="17" rx="8.5" fill="#f5f3ff"/>
  <text class="tag" x="630" y="562" fill="#7c3aed">MCP SERVER</text>
  <text class="cardRole" x="474" y="589">PDF parsing and OCR</text>
  <text class="cardRole" x="474" y="608">Text-native first, OCR fallback</text>
  <text class="cardMeta" x="474" y="633">unstructured &#183; Tesseract 5.5</text>
  <text class="cardMeta" x="474" y="652">docs_server:0.1.0 &#183; 1.23 GB</text>

  <!-- ============ DATA ============ -->
  <rect class="card" x="800" y="340" width="262" height="330" rx="8" filter="url(#sh)"/>
  <rect x="800" y="340" width="262" height="3.5" rx="1.75" fill="#db2777"/>
  <text class="cardTitle" x="822" y="374">./data</text>
  <rect x="944" y="360" width="86" height="17" rx="8.5" fill="#fdf2f8"/>
  <text class="tag" x="954" y="372" fill="#db2777">BIND MOUNT</text>
  <text class="cardRole" x="822" y="401">Mounted at /app/data</text>

  <line class="rule" x1="822" y1="420" x2="1040" y2="420"/>
  <text class="cardRole" x="822" y="446">raw_docs/</text>
  <text class="cardMeta" x="822" y="465">Source corpus &#183; text and scanned</text>
  <text class="cardRole" x="822" y="500">chroma_db/</text>
  <text class="cardMeta" x="822" y="519">Persisted vectors &#183; 384-dim</text>
  <line class="rule" x1="822" y1="546" x2="1040" y2="546"/>
  <text class="cardMeta" x="822" y="572">No named volumes anywhere,</text>
  <text class="cardMeta" x="822" y="591">so every byte of state stays</text>
  <text class="cardMeta" x="822" y="610">visible and auditable on M:\.</text>

  <!-- ============ PORT PROXY ============ -->
  <rect class="card" x="1244" y="300" width="270" height="112" rx="8" filter="url(#sh)"/>
  <rect x="1244" y="300" width="270" height="3.5" rx="1.75" fill="#64748b"/>
  <text class="cardTitle" x="1266" y="334">Port proxy</text>
  <text class="cardRole" x="1266" y="359">172.28.64.1:8001 -&gt; loopback</text>
  <text class="cardMeta" x="1266" y="382">netsh portproxy &#183; IP Helper</text>
  <text class="cardMeta" x="1266" y="400">Firewall scoped to WSL subnet</text>

  <!-- ============ LLM ============ -->
  <rect class="card" x="1244" y="470" width="270" height="150" rx="8" filter="url(#sh)"/>
  <rect x="1244" y="470" width="270" height="3.5" rx="1.75" fill="#f59e0b"/>
  <text class="cardTitle" x="1266" y="504">llama-server</text>
  <rect x="1266" y="516" width="122" height="17" rx="8.5" fill="#fffbeb"/>
  <text class="tag" x="1276" y="528" fill="#b45309">EXTERNAL &#183; SHARED</text>
  <text class="cardRole" x="1266" y="556">Qwen3-4B-Instruct-2507</text>
  <text class="cardMeta" x="1266" y="578">Q4_K_M &#183; GPU-resident &#183; :8001</text>
  <text class="cardMeta" x="1266" y="597">Bound 127.0.0.1 &#183; one instance</text>

  <!-- ============ FLOWS ============ -->
  <!-- 1 agent -> rag -->
  <line class="flow" x1="394" y1="392" x2="448" y2="392" marker-end="url(#ah)"/>
  <circle class="badgeC" cx="421" cy="368" r="10"/>
  <text class="badgeT" x="421" y="372" text-anchor="middle">1</text>

  <!-- 2 agent -> docs -->
  <path class="flow" d="M263,480 L263,600 L448,600" marker-end="url(#ah)"/>
  <circle class="badgeC" cx="263" cy="540" r="10"/>
  <text class="badgeT" x="263" y="544" text-anchor="middle">2</text>

  <!-- api key pills -->
  <rect class="pill" x="386" y="404" width="70" height="18" rx="9"/>
  <text class="pillT" x="421" y="417" text-anchor="middle">API KEY</text>
  <rect class="pill" x="298" y="578" width="70" height="18" rx="9"/>
  <text class="pillT" x="333" y="591" text-anchor="middle">API KEY</text>

  <!-- 3 servers -> data -->
  <line class="flow" x1="744" y1="392" x2="796" y2="392" marker-end="url(#ah)"/>
  <circle class="badgeC" cx="770" cy="368" r="10"/>
  <text class="badgeT" x="770" y="372" text-anchor="middle">3</text>
  <line class="flow" x1="744" y1="600" x2="796" y2="600" marker-end="url(#ah)"/>
  <circle class="badgeC" cx="770" cy="624" r="10"/>
  <text class="badgeT" x="770" y="628" text-anchor="middle">3</text>

  <!-- 4 agent -> proxy -->
  <path class="flow" d="M350,340 L350,272 L1379,272 L1379,296" marker-end="url(#ah)"/>
  <circle class="badgeC" cx="820" cy="272" r="10"/>
  <text class="badgeT" x="820" y="276" text-anchor="middle">4</text>

  <!-- 5 proxy -> llm -->
  <line class="flow" x1="1379" y1="412" x2="1379" y2="466" marker-end="url(#ah)"/>
  <circle class="badgeC" cx="1379" cy="439" r="10"/>
  <text class="badgeT" x="1379" y="443" text-anchor="middle">5</text>

  <!-- ============ LEGEND ============ -->
  <line class="rule" x1="48" y1="800" x2="1552" y2="800"/>
  <text class="legendH" x="48" y="826">REQUEST PATH</text>

  <circle class="badgeC" cx="58"  cy="860" r="10"/><text class="badgeT" x="58"  y="864" text-anchor="middle">1</text>
  <text class="legendT" x="78" y="864">Agent calls search_documents over HTTP</text>

  <circle class="badgeC" cx="58"  cy="892" r="10"/><text class="badgeT" x="58"  y="896" text-anchor="middle">2</text>
  <text class="legendT" x="78" y="896">Falls through to parse_document when a file is unindexed</text>

  <circle class="badgeC" cx="560" cy="860" r="10"/><text class="badgeT" x="560" y="864" text-anchor="middle">3</text>
  <text class="legendT" x="580" y="864">Servers read the bind-mounted corpus and vector store</text>

  <circle class="badgeC" cx="560" cy="892" r="10"/><text class="badgeT" x="560" y="896" text-anchor="middle">4</text>
  <text class="legendT" x="580" y="896">Reasoning calls go to host.docker.internal:8001</text>

  <circle class="badgeC" cx="1100" cy="860" r="10"/><text class="badgeT" x="1100" y="864" text-anchor="middle">5</text>
  <text class="legendT" x="1120" y="864">Proxy forwards to the loopback-bound model</text>

  <rect class="pill" x="1090" y="883" width="70" height="18" rx="9"/>
  <text class="pillT" x="1125" y="896" text-anchor="middle">API KEY</text>
  <text class="legendT" x="1172" y="896">Checked before any MCP handler runs</text>
</svg>
